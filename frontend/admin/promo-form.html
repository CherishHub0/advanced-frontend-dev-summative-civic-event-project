<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promo form · Admin · CivicEvents+</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="min-h-screen antialiased">
  <header id="site-header"></header>
  <main id="main" class="mx-auto grid max-w-7xl gap-6 px-4 py-8 sm:px-6 lg:grid-cols-[220px_1fr]">
    <aside id="admin-sidebar"></aside>
    <div class="min-w-0">
      <p class="text-sm font-medium text-sage-700">Admin</p>
      <h1 id="form-title" class="mt-1 font-display text-3xl font-bold tracking-tight text-stone-900">New promo</h1>
      <p class="mt-1 text-sm text-stone-500">Upload a short video. Captions are generated from the caption text you write.</p>
      <form id="promo-form" class="mt-6 grid gap-6 xl:grid-cols-[1fr_360px]" novalidate>
        <div class="space-y-5 rounded-2xl border border-stone-200 bg-white p-5 sm:p-6">
          <div>
            <label for="title" class="mb-1.5 block text-sm font-medium text-stone-700">Title <span class="text-red-600" aria-hidden="true">*</span></label>
            <input id="title" type="text" maxlength="150" required aria-describedby="title-err" class="w-full rounded-xl border border-stone-200 px-3.5 py-2.5 text-sm focus:border-sage-400 focus:outline-none focus:ring-2 focus:ring-sage-100">
            <p id="title-err" class="mt-1 hidden text-xs text-red-700"></p>
          </div>
          <div>
            <label for="description" class="mb-1.5 block text-sm font-medium text-stone-700">Description <span class="text-red-600" aria-hidden="true">*</span></label>
            <textarea id="description" rows="3" required aria-describedby="description-err" class="w-full rounded-xl border border-stone-200 px-3.5 py-2.5 text-sm focus:border-sage-400 focus:outline-none focus:ring-2 focus:ring-sage-100"></textarea>
            <p id="description-err" class="mt-1 hidden text-xs text-red-700"></p>
          </div>
          <div>
            <label for="caption_text" class="mb-1.5 block text-sm font-medium text-stone-700">Caption text <span class="text-red-600" aria-hidden="true">*</span></label>
            <textarea id="caption_text" rows="5" required aria-describedby="caption_text-help caption_text-err" class="w-full rounded-xl border border-stone-200 px-3.5 py-2.5 text-sm focus:border-sage-400 focus:outline-none focus:ring-2 focus:ring-sage-100" placeholder="What is said in the video. Write it in sentences."></textarea>
            <p id="caption_text-help" class="mt-1 text-xs text-stone-500">Each sentence becomes one caption line, spread evenly across the video. It's also shown as a transcript.</p>
            <p id="caption_text-err" class="mt-1 hidden text-xs text-red-700"></p>
          </div>
          <label id="pub-wrap" class="hidden items-center gap-3 text-sm text-stone-700">
            <input id="published" type="checkbox" class="h-4 w-4 rounded border-stone-300 text-sage-600 focus:ring-sage-500"> Published (visible to everyone)
          </label>
        </div>
        <div class="space-y-4">
          <div class="rounded-2xl border border-stone-200 bg-white p-5">
            <p class="text-sm font-medium text-stone-700">Video <span id="video-req" class="text-red-600" aria-hidden="true">*</span></p>
            <p class="text-xs text-stone-500">MP4, MOV, AVI or MKV, up to 8 MB. MP4 plays best in browsers.</p>
            <label for="video" class="mt-3 grid aspect-video cursor-pointer place-items-center overflow-hidden rounded-xl border-2 border-dashed border-stone-200 bg-stone-50 text-center text-sm text-stone-500 transition hover:border-sage-300" id="video-drop">
              <span id="video-placeholder">Click to choose a video</span>
            </label>
            <video id="video-preview" controls class="mt-3 hidden aspect-video w-full rounded-xl bg-black"></video>
            <input id="video" type="file" accept=".mp4,.mov,.avi,.mkv,video/*" class="sr-only" aria-describedby="video-err">
            <p id="video-info" class="mt-2 hidden text-xs text-stone-500"></p>
            <p id="video-err" class="mt-2 hidden text-xs text-red-700" role="alert"></p>
          </div>
          <div class="flex gap-2">
            <a id="cancel-link" href="../promos.html" class="flex-1 rounded-xl border border-stone-200 bg-white px-4 py-2.5 text-center text-sm font-medium text-stone-700 hover:bg-stone-50">Cancel</a>
            <button id="save-btn" type="submit" class="flex flex-1 items-center justify-center rounded-xl bg-sage-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-sage-700 disabled:opacity-60">Upload promo</button>
          </div>
        </div>
      </form>
    </div>
  </main>
  <footer id="site-footer"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/shared.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/pages/promo-form.js"></script>
</body>
</html>
