<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Announcement form · Admin · CivicEvents+</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="min-h-screen antialiased">
  <header id="site-header"></header>
  <main id="main" class="mx-auto grid max-w-7xl gap-6 px-4 py-8 sm:px-6 lg:grid-cols-[220px_1fr]">
    <aside id="admin-sidebar"></aside>
    <div class="min-w-0">
      <p class="text-sm font-medium text-sage-700">Admin</p>
      <h1 id="form-title" class="mt-1 font-display text-3xl font-bold tracking-tight text-stone-900">New announcement</h1>
      <p id="form-sub" class="mt-1 text-sm text-stone-500">Upload a short audio message. Everyone gets notified.</p>
      <form id="ann-form" class="mt-6 max-w-2xl space-y-5 rounded-2xl border border-stone-200 bg-white p-5 sm:p-6" novalidate>
        <div>
          <label for="title" class="mb-1.5 block text-sm font-medium text-stone-700">Title <span class="text-red-600" aria-hidden="true">*</span></label>
          <input id="title" type="text" maxlength="150" required aria-describedby="title-err" class="w-full rounded-xl border border-stone-200 px-3.5 py-2.5 text-sm focus:border-sage-400 focus:outline-none focus:ring-2 focus:ring-sage-100" placeholder="e.g. Water maintenance this weekend">
          <p id="title-err" class="mt-1 hidden text-xs text-red-700"></p>
        </div>
        <div id="audio-field">
          <p class="mb-1.5 text-sm font-medium text-stone-700">Audio file <span class="text-red-600" aria-hidden="true">*</span></p>
          <label for="audio" class="flex cursor-pointer items-center gap-4 rounded-xl border-2 border-dashed border-stone-200 p-4 transition hover:border-sage-300">
            <span class="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-sage-50 text-sage-700" aria-hidden="true">♪</span>
            <span><span id="audio-name" class="block text-sm font-medium text-stone-700">Choose an audio file</span><span class="block text-xs text-stone-500">MP3, WAV, M4A or OGG, up to 5 MB</span></span>
          </label>
          <input id="audio" type="file" accept=".mp3,.wav,.m4a,.ogg,audio/*" class="sr-only" aria-describedby="audio-err">
          <p id="audio-err" class="mt-1 hidden text-xs text-red-700" role="alert"></p>
          <audio id="audio-preview" controls class="mt-3 hidden w-full"></audio>
        </div>
        <p id="audio-note" class="hidden rounded-xl bg-stone-100 px-4 py-3 text-xs text-stone-600">The backend only lets you change the title and visibility of an existing announcement. To change the audio, create a new one.</p>
        <label class="flex items-center gap-3 text-sm text-stone-700">
          <input id="published" type="checkbox" checked class="h-4 w-4 rounded border-stone-300 text-sage-600 focus:ring-sage-500">
          Published (visible to everyone)
        </label>
        <div class="flex justify-end gap-2 pt-2">
          <a id="cancel-link" href="../announcements.html" class="rounded-xl border border-stone-200 px-4 py-2.5 text-sm font-medium text-stone-700 hover:bg-stone-50">Cancel</a>
          <button id="save-btn" type="submit" class="flex items-center rounded-xl bg-sage-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-sage-700 disabled:opacity-60">Publish announcement</button>
        </div>
      </form>
    </div>
  </main>
  <footer id="site-footer"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/shared.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/pages/announcement-form.js"></script>
</body>
</html>
