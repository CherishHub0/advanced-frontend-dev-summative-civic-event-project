<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Admin · CivicEvents+</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="min-h-screen antialiased">
  <header id="site-header"></header>
  <main id="main" class="mx-auto grid max-w-7xl gap-6 px-4 py-8 sm:px-6 lg:grid-cols-[220px_1fr]">
    <aside id="admin-sidebar"></aside>
    <div class="min-w-0">
      <p class="text-sm font-medium text-sage-700">Admin</p>
      <h1 class="mt-1 font-display text-3xl font-bold tracking-tight text-stone-900">Overview</h1>
      <p class="mt-1 text-sm text-stone-500">A calm look at how the community is doing.</p>
      <div id="stat-cards" class="mt-6 grid grid-cols-2 gap-4 xl:grid-cols-4" aria-busy="true"></div>
      <div class="mt-6 grid gap-4 xl:grid-cols-3">
        <section class="rounded-2xl border border-stone-200 bg-white p-5 xl:col-span-2">
          <h2 class="text-sm font-semibold text-stone-800">New users per month</h2>
          <div class="mt-4 h-64"><canvas id="growth-chart" role="img" aria-label="Line chart of new users per month"></canvas></div>
          <p id="growth-table" class="sr-only"></p>
        </section>
        <section class="rounded-2xl border border-stone-200 bg-white p-5">
          <h2 class="text-sm font-semibold text-stone-800">Events</h2>
          <div class="mt-4 h-64"><canvas id="events-chart" role="img" aria-label="Doughnut chart of upcoming and past events"></canvas></div>
        </section>
      </div>
      <section class="mt-4 rounded-2xl border border-stone-200 bg-white p-5">
        <h2 class="text-sm font-semibold text-stone-800">Content and engagement</h2>
        <div class="mt-4 h-56"><canvas id="content-chart" role="img" aria-label="Bar chart of content and engagement totals"></canvas></div>
      </section>
      <section class="mt-4 grid gap-3 sm:grid-cols-3">
        <a href="event-form.html" class="rounded-2xl border border-stone-200 bg-white p-5 transition hover:border-sage-300"><p class="font-display font-semibold text-stone-900">Create an event</p><p class="mt-1 text-sm text-stone-500">Add something to the calendar.</p></a>
        <a href="announcement-form.html" class="rounded-2xl border border-stone-200 bg-white p-5 transition hover:border-sage-300"><p class="font-display font-semibold text-stone-900">Record an announcement</p><p class="mt-1 text-sm text-stone-500">Upload a short audio update.</p></a>
        <a href="users.html" class="rounded-2xl border border-stone-200 bg-white p-5 transition hover:border-sage-300"><p class="font-display font-semibold text-stone-900">Manage users</p><p class="mt-1 text-sm text-stone-500">Enable or disable accounts.</p></a>
      </section>
    </div>
  </main>
  <footer id="site-footer"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/shared.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/pages/dashboard.js"></script>
</body>
</html>
