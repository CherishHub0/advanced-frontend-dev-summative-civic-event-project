<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event form · Admin · CivicEvents+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="min-h-screen antialiased">
  <header id="site-header"></header>

  <main id="main" class="mx-auto grid max-w-7xl gap-6 px-4 py-8 sm:px-6 lg:grid-cols-[220px_1fr]">
    <aside id="admin-sidebar"></aside>

    <div class="min-w-0">
      <p class="text-sm font-medium text-sage-700">Admin</p>
      <h1 id="form-title" class="mt-1 font-display text-3xl font-bold tracking-tight text-stone-900">Create event</h1>
      <p class="mt-1 text-sm text-stone-500">Everyone gets a notification when a new event is created.</p>

      <form id="event-form" class="mt-6 grid gap-6 xl:grid-cols-[1fr_340px]" novalidate>
        <div class="space-y-5 rounded-2xl border border-stone-200 bg-white p-5 sm:p-6">
          <div>
            <label for="title" class="mb-1.5 block text-sm font-medium text-stone-700">Title <span class="text-red-600" aria-hidden="true">*</span></label>
            <input id="title" type="text" maxlength="150" required aria-describedby="title-err" class="w-full rounded-xl border border-stone-200 px-3.5 py-2.5 text-sm focus:border-sage-400 focus:outline-none focus:ring-2 focus:ring-sage-100" placeholder="e.g. Community Clean-up Day">
            <p id="title-err" class="mt-1 hidden text-xs text-red-700"></p>
          </div>
          <div>
            <label for="description" class="mb-1.5 block text-sm font-medium text-stone-700">Description</label>
            <textarea id="description" rows="5" class="w-full rounded-xl border border-stone-200 px-3.5 py-2.5 text-sm focus:border-sage-400 focus:outline-none focus:ring-2 focus:ring-sage-100" placeholder="What's happening, who it's for, what to bring…"></textarea>
          </div>
          <div>
            <label for="location" class="mb-1.5 block text-sm font-medium text-stone-700">Location <span class="text-red-600" aria-hidden="true">*</span></label>
            <input id="location" type="text" required aria-describedby="location-err" class="w-full rounded-xl border border-stone-200 px-3.5 py-2.5 text-sm focus:border-sage-400 focus:outline-none focus:ring-2 focus:ring-sage-100" placeholder="e.g. Kimironko Park">
            <p id="location-err" class="mt-1 hidden text-xs text-red-700"></p>
          </div>
          <div class="grid gap-4 sm:grid-cols-2">
            <div>
              <label for="starts_at" class="mb-1.5 block text-sm font-medium text-stone-700">Starts <span class="text-red-600" aria-hidden="true">*</span></label>
              <input id="starts_at" type="datetime-local" required aria-describedby="starts_at-err" class="w-full rounded-xl border border-stone-200 px-3.5 py-2.5 text-sm focus:border-sage-400 focus:outline-none focus:ring-2 focus:ring-sage-100">
              <p id="starts_at-err" class="mt-1 hidden text-xs text-red-700"></p>
            </div>
            <div>
              <label for="ends_at" class="mb-1.5 block text-sm font-medium text-stone-700">Ends <span class="text-red-600" aria-hidden="true">*</span></label>
              <input id="ends_at" type="datetime-local" required aria-describedby="ends_at-err" class="w-full rounded-xl border border-stone-200 px-3.5 py-2.5 text-sm focus:border-sage-400 focus:outline-none focus:ring-2 focus:ring-sage-100">
              <p id="ends_at-err" class="mt-1 hidden text-xs text-red-700"></p>
            </div>
          </div>
        </div>

        <div class="space-y-4">
          <div class="rounded-2xl border border-stone-200 bg-white p-5">
            <p class="text-sm font-medium text-stone-700">Cover image</p>
            <p class="text-xs text-stone-500">JPG, PNG or GIF, up to 2 MB.</p>
            <label id="drop" for="image" class="mt-3 block cursor-pointer overflow-hidden rounded-xl border-2 border-dashed border-stone-200 transition hover:border-sage-300">
              <div id="preview" class="grid h-48 place-items-center bg-stone-50 text-center text-sm text-stone-500">
                <span>Click to choose an image<br><span class="text-xs text-stone-400">or drag it here</span></span>
              </div>
            </label>
            <input id="image" type="file" accept=".jpg,.jpeg,.png,.gif,image/jpeg,image/png,image/gif" class="sr-only" aria-describedby="image-err">
            <p id="image-info" class="mt-2 hidden text-xs text-stone-500"></p>
            <p id="image-err" class="mt-2 hidden text-xs text-red-700" role="alert"></p>
            <button id="image-clear" type="button" class="mt-2 hidden text-xs font-medium text-stone-500 hover:text-stone-800">Remove selected image</button>
          </div>
          <div class="flex gap-2">
            <a id="cancel-link" href="../events.html" class="flex-1 rounded-xl border border-stone-200 bg-white px-4 py-2.5 text-center text-sm font-medium text-stone-700 hover:bg-stone-50">Cancel</a>
            <button id="save-btn" type="submit" class="flex flex-1 items-center justify-center rounded-xl bg-sage-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-sage-700 disabled:opacity-60">Create event</button>
          </div>
          <p class="text-xs leading-relaxed text-stone-400">Note: the backend publishes every event straight away. It doesn't support a draft or published switch for events.</p>
        </div>
      </form>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/shared.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/pages/event-form.js"></script>
</body>
</html>
