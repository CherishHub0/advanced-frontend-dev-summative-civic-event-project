<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications · CivicEvents+</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="min-h-screen antialiased">
  <header id="site-header"></header>
  <main id="main" class="mx-auto max-w-5xl px-4 py-8 sm:px-6 sm:py-10">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm font-medium text-sage-700">Inbox</p>
        <h1 class="mt-1 font-display text-3xl font-bold tracking-tight text-stone-900">Notifications</h1>
        <p id="n-sub" class="mt-1 text-sm text-stone-500" aria-live="polite"></p>
      </div>
      <div class="flex items-center gap-2">
        <div class="inline-flex rounded-xl border border-stone-200 bg-white p-1" role="group" aria-label="Filter">
          <button type="button" data-f="all" class="js-f rounded-lg px-3 py-1.5 text-sm font-medium" aria-pressed="true">All</button>
          <button type="button" data-f="unread" class="js-f rounded-lg px-3 py-1.5 text-sm font-medium" aria-pressed="false">Unread</button>
        </div>
        <button id="mark-all" type="button" class="rounded-xl border border-stone-200 bg-white px-3 py-2 text-sm font-medium text-stone-600 hover:bg-stone-50">Mark all read</button>
      </div>
    </div>
    <div class="mt-6 grid gap-5 lg:grid-cols-[1fr_1.1fr]">
      <ul id="n-list" class="space-y-2" aria-busy="true"></ul>
      <section id="n-detail" class="hidden rounded-2xl border border-stone-200 bg-white p-6 lg:sticky lg:top-24 lg:self-start" aria-live="polite"></section>
    </div>
  </main>
  <footer id="site-footer"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/shared.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/pages/notifications.js"></script>
</body>
</html>
