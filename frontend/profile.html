<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My profile · CivicEvents+</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="min-h-screen antialiased">
  <header id="site-header"></header>
  <main id="main" class="mx-auto max-w-4xl px-4 py-8 sm:px-6 sm:py-10">
    <p class="text-sm font-medium text-sage-700">Account</p>
    <h1 class="mt-1 font-display text-3xl font-bold tracking-tight text-stone-900">My profile</h1>
    <div class="mt-6 grid gap-6 md:grid-cols-[1fr_280px]">
      <form id="profile-form" class="space-y-5 rounded-2xl border border-stone-200 bg-white p-5 sm:p-6" novalidate aria-busy="true">
        <div class="flex items-center gap-4">
          <span id="avatar" class="grid h-14 w-14 place-items-center rounded-full bg-sage-100 font-display text-lg font-bold text-sage-700">?</span>
          <div><p id="p-name" class="font-display text-lg font-semibold text-stone-900"></p><p id="p-meta" class="text-sm text-stone-500"></p></div>
        </div>
        <div>
          <label for="full_name" class="mb-1.5 block text-sm font-medium text-stone-700">Full name</label>
          <input id="full_name" type="text" autocomplete="name" required aria-describedby="full_name-err" class="w-full rounded-xl border border-stone-200 px-3.5 py-2.5 text-sm focus:border-sage-400 focus:outline-none focus:ring-2 focus:ring-sage-100">
          <p id="full_name-err" class="mt-1 hidden text-xs text-red-700"></p>
        </div>
        <div>
          <label for="email" class="mb-1.5 block text-sm font-medium text-stone-700">Email</label>
          <input id="email" type="email" autocomplete="email" required aria-describedby="email-err" class="w-full rounded-xl border border-stone-200 px-3.5 py-2.5 text-sm focus:border-sage-400 focus:outline-none focus:ring-2 focus:ring-sage-100">
          <p id="email-err" class="mt-1 hidden text-xs text-red-700"></p>
        </div>
        <div>
          <p class="mb-1.5 text-sm font-medium text-stone-700">Role</p>
          <p id="role" class="rounded-xl bg-stone-100 px-3.5 py-2.5 text-sm capitalize text-stone-600"></p>
          <p class="mt-1 text-xs text-stone-400">Roles can't be changed from the app.</p>
        </div>
        <div class="flex justify-end gap-2">
          <button id="reset-btn" type="button" class="rounded-xl px-4 py-2.5 text-sm font-medium text-stone-600 hover:bg-stone-100">Reset</button>
          <button id="save-btn" type="submit" class="flex items-center rounded-xl bg-sage-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-sage-700 disabled:opacity-60">Save changes</button>
        </div>
      </form>
      <aside class="space-y-3">
        <h2 class="text-sm font-semibold text-stone-800">Your activity</h2>
        <div id="stats" class="grid grid-cols-2 gap-3 md:grid-cols-1"></div>
      </aside>
    </div>
  </main>
  <footer id="site-footer"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/shared.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/pages/profile.js"></script>
</body>
</html>
